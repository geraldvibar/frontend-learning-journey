<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class='container'>
            <h1>Job Application Form</h1>
        <form>
            <label for='name'>Full Name: </label>
            <input type='text' id='name' name='name' placeholder='Enter your name' required>

            <label for='email'>Email: </label>
            <input type='email' id='email' name='email' placeholder='Enter your email' required></input>

            <label for='position'>Position: </label>
            <select id='position' required>
                <option value=''>Select a position</option>
                <option value='Front-End Developer'>Front-End Developer</option>

                <option value='Back-End Developer'>Back-End Developer</option>
            </select>

            <fieldset class='radio-group'>
                <legend>Availability:</legend>
                <input type='radio' id='full-time'  name='availability' value='FullTime'>
                <label for='full-time' >Full Time</label>

                <input type='radio' id='part-time'  name='availability' value='PartTime'>
                <label for='part-time' >Part Time</label>
            </fieldset>

            <label for='message'>Why do you want this job?</label>
            <textarea id='message' placeholder='Write your motivation' required></textarea>

            <button type='submit'>Submit Application</button>
        </form>
    </div>   
</body>
</html>
